<!DOCTYPE html>
<!--
The QR code of RemoteSupport leads here: link.html#<language>,<distribution>,<receiver>,<sshx link>
The language is the locale of enigma2 like de_DE.
The distribution and the receiver are URL encoded.
The fragment never reaches the server, so the link with its key stays on the phone.
Older plugin versions call the current page, keep the format.
The texts come from texts.js, which the workflow sharetexts.yml writes from the .po files of the plugin.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Remote Support</title>
<link rel="stylesheet" href="link.css">
</head>
<body>
<h1 id="title">Remote Support</h1>
<div id="session" hidden>
<p data-text="send"></p>
<div class="link" id="link"></div>
<div class="buttons">
<button class="share" id="share" data-text="share" hidden></button>
<button class="discord" id="discord">Discord</button>
<a class="telegram" id="telegram">Telegram</a>
<a class="whatsapp" id="whatsapp">WhatsApp</a>
<a id="sms">SMS</a>
<a id="mail" data-text="mail">E-mail</a>
<button id="copy" data-text="copy"></button>
</div>
<p class="hint" data-text="doNotOpen"></p>
<p class="warning" data-text="warning"></p>
</div>
<p id="missing" data-text="missing" hidden></p>
<script src="texts.js"></script>
<script src="link.js"></script>
</body>
</html>
